services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    networks:
      - pulseops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulseops-net
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0
    volumes:
      - azurite_data:/data
    networks:
      - pulseops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:10001/devstoreaccount1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: python src/workers/provisioning_worker.py
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    networks:
      - pulseops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f provisioning_worker.py"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  pulseops-net:
    driver: bridge

volumes:
  pgdata:
  azurite_data:
